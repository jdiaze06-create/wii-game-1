name: Build Wii game

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc
    steps:
      - uses: actions/checkout@v4

      - name: Compile
        run: make clean && make

      - name: Package
        run: |
          mkdir -p out/apps/Alley_Showdown
          cp Alley_Showdown.dol out/Alley_Showdown.dol
          cp Alley_Showdown.dol out/apps/Alley_Showdown/boot.dol
          cp apps/Alley_Showdown/meta.xml out/apps/Alley_Showdown/meta.xml

      - uses: actions/upload-artifact@v4
        with:
          name: Alley_Showdown_Wii
          path: out
