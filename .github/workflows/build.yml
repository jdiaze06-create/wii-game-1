name: Build Wii game

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc
    steps:
      - uses: actions/checkout@v4

      - name: Compile
        run: make clean && make

      - name: Package
        run: |
          mkdir -p out/apps/Dead_Light
          cp Dead_Light.dol out/Dead_Light.dol
          cp Dead_Light.dol out/apps/Dead_Light/boot.dol
          cp apps/Dead_Light/meta.xml out/apps/Dead_Light/meta.xml

      - uses: actions/upload-artifact@v4
        with:
          name: Dead_Light_Wii
          path: out
